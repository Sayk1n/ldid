name: Build Theos tweak on macOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "PATH=$HOME/theos/bin:$PATH" >> $GITHUB_ENV

      - name: Show Xcode and clang
        run: |
          xcodebuild -version || true
          clang --version || true

      - name: Build tweak with Theos
        env:
          THEOS: ${{ env.THEOS }}
        run: |
          cd $GITHUB_WORKSPACE
          make clean || true
          make -j$(sysctl -n hw.ncpu) 2>&1 | tee build.log
          tail -n 200 build.log || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: theos-build
          path: |
            *.deb
            .theos/obj/**/*
            build.log
